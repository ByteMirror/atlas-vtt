name: Plugin CI

on:
  pull_request:
  push:
    branches:
      - main
      - beta

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The rule set Obsidian's community directory scores the plugin with.
      # Zero tolerance; accepted exceptions live in eslint-suppressions.json.
      - name: Lint
        run: npm run lint

      - name: Verify release channel (main = stable x.y.z, beta = x.y.z-beta.N)
        run: node scripts/release-channel.js --branch "${{ github.base_ref || github.ref_name }}"

      - name: Check release notes
        run: npm run changelog:check

      - name: Test reporting service
        run: python3 -m unittest discover -s services/issue-reporter

      - name: Test
        run: npx vitest run

      - name: Build plugin
        run: npm run build:ci

      - name: Smoke test postbuild hook (used by npm run build)
        run: npm run postbuild

      - name: Preflight (community directory review checks)
        run: npm run preflight

      - name: Prepare installable test build
        run: npm run release:prepare

      - name: Upload plugin test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-vtt-${{ github.event.pull_request.head.sha || github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Fails a pull request that adds a dependency with a known vulnerability.
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

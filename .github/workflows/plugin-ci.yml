name: Plugin CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      # Keep the existing typing backlog visible while typecheck/tests gate CI.
      - name: ESLint report (advisory)
        continue-on-error: true
        run: npm run lint -- --format json --output-file eslint-report.json

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          if-no-files-found: warn

      - name: Build plugin
        run: npm run build:ci

      - name: Smoke test postbuild hook (used by npm run build)
        run: npm run postbuild

      - name: Preflight (community directory review checks)
        run: npm run preflight

      - name: Prepare installable test build
        run: npm run release:prepare

      - name: Upload plugin test build
        uses: actions/upload-artifact@v4
        with:
          name: atlas-vtt-${{ github.event.pull_request.head.sha || github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
